plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // Р Р°Р·СЂРµС€РµРЅРёРµ РєРѕРЅС„Р»РёРєС‚Р° РЅР°С‚РёРІРЅС‹С… Р±РёР±Р»РёРѕС‚РµРє: Whisper Рё ExecuTorch РЅРµСЃСѓС‚
    // РѕРґРёРЅР°РєРѕРІС‹Р№ libc++_shared.so вЂ” Р±РµСЂС‘Рј РїРµСЂРІС‹Р№ (РѕРЅРё РёРґРµРЅС‚РёС‡РЅС‹).
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    namespace 'com.example.voicenotes'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.voicenotes"
        minSdk 24
        targetSdk 34
        versionCode 136
        versionName "136.0"
        ndk {
            // Whisper СЂР°Р±РѕС‚Р°РµС‚ С‚РѕР»СЊРєРѕ РЅР° arm64-v8a (РїРѕРєСЂС‹РІР°РµС‚ РІСЃРµ СЃРѕРІСЂРµРјРµРЅРЅС‹Рµ С‚РµР»РµС„РѕРЅС‹,
            // РІРєР»СЋС‡Р°СЏ Samsung S25). РћРіСЂР°РЅРёС‡РµРЅРёРµ СѓРїСЂРѕС‰Р°РµС‚ Рё СѓСЃРєРѕСЂСЏРµС‚ СЃР±РѕСЂРєСѓ.
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // РїРѕРґРїРёСЃС‹РІР°РµРј debug С‚РµРј Р¶Рµ РїРѕСЃС‚РѕСЏРЅРЅС‹Рј РєР»СЋС‡РѕРј, РµСЃР»Рё РѕРЅ Р·Р°РґР°РЅ
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // РћС„Р»Р°Р№РЅ-СЂР°СЃРїРѕР·РЅР°РІР°РЅРёРµ Vosk (Р°СѓРґРёРѕ + С‚РµРєСЃС‚ РёР· РѕРґРЅРѕРіРѕ РїРѕС‚РѕРєР°)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    // РћС„Р»Р°Р№РЅ-СЂР°СЃРїРѕР·РЅР°РІР°РЅРёРµ Whisper (С‚РѕС‡РЅРѕРµ, РїРѕ Р·Р°РїРёСЃР°РЅРЅРѕРјСѓ С„Р°Р№Р»Сѓ, arm64)
    implementation 'dev.ffmpegkit-maintained:whisper-android:1.0.0'
    // Р›РѕРєР°Р»СЊРЅС‹Р№ РР РЅР° СѓСЃС‚СЂРѕР№СЃС‚РІРµ (ExecuTorch, LLaMA/Gemma, arm64)
    implementation 'org.pytorch:executorch-android:1.0.0'
    // РћР±СЏР·Р°С‚РµР»СЊРЅС‹Рµ Р·Р°РІРёСЃРёРјРѕСЃС‚Рё ExecuTorch (РёРЅР°С‡Рµ РЅР°С‚РёРІРЅР°СЏ Р±РёР±Р»РёРѕС‚РµРєР° РЅРµ Р·Р°РіСЂСѓР·РёС‚СЃСЏ).
    implementation 'com.facebook.soloader:soloader:0.10.5'
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
}






